name: Standalone tools

on:
  push:
    branches: [main]
    tags: ['tools-v*']
  pull_request:
  workflow_dispatch:
    inputs:
      sign_release:
        description: Sign and notarize with developer credentials
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  SPLAT_BROWSER_SOURCE: ${{ github.workspace }}/output/browser-source
  SIGN_RELEASE: ${{ inputs.sign_release && 'true' || 'false' }}

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    env:
      WINDOWS_SIGNING_PROVIDER: ${{ vars.WINDOWS_SIGNING_PROVIDER || 'azure' }}
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
      WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_CERTIFICATE_THUMBPRINT }}
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Stable standalone release validation gate
        if: startsWith(github.ref, 'refs/tags/tools-v')
        env:
          VALIDATED: ${{ vars.STANDALONE_PHYSICAL_VALIDATION_APPROVED }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#tools-v}"
          if [[ "$version" != *-* ]]; then
            test "$VALIDATED" = "true" || { echo 'Complete standalone physical-device validation before a stable release.'; exit 1; }
            echo 'SIGN_RELEASE=true' >> "$GITHUB_ENV"
          fi
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config xvfb dbus-x11
      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: Read paired browser revision
        if: runner.os == 'Linux'
        id: browser
        shell: bash
        run: python3 -c 'import json;print("revision="+json.load(open("frontend/standalone-manifest.json"))["revision"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: runner.os == 'Linux'
        with:
          repository: mguhlin/drawsplat
          ref: ${{ steps.browser.outputs.revision }}
          path: output/browser-source
      - run: npm ci
      - run: python3 scripts/check-assets.py
      - name: Browser checks and Go vulnerability scan
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium webkit
          npm test
          go test -race -tags webkit2_41 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -tags webkit2_41 ./...
      - name: Prepare verified Microsoft WebView2 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-windows.ps1
      - uses: azure/login@v2
        if: runner.os == 'Windows' && env.SIGN_RELEASE == 'true' && env.WINDOWS_SIGNING_PROVIDER == 'azure'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and verify all standalone applications
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#tools-v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then version="0.3.0-preview.1"; fi
          python3 scripts/release-profiles.py --platform '${{ matrix.platform }}' --version "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.platform }}
          path: output/standalone-release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-evidence-${{ matrix.platform }}
          path: |
            output/standalone-native/
            output/profiles/*/output/native/*.json
            test-results/
  release:
    if: startsWith(github.ref, 'refs/tags/tools-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: standalone-*
          path: downloaded
      - name: Collect distribution artifacts
        run: mkdir release && cp downloaded/standalone-linux/* downloaded/standalone-windows/* downloaded/standalone-macos/* release/ && python3 scripts/verify-packages.py release
      - name: Publish standalone apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          version="${GITHUB_REF_NAME#tools-v}"
          if [[ "$version" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag "${args[@]}" --title "SplatWorks standalone tools ${GITHUB_REF_NAME#tools-v}" --notes-file docs/STANDALONE-RELEASE.md

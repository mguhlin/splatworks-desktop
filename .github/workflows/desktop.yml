name: Desktop builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      sign_release:
        description: Sign and notarize using configured developer credentials
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  SPLAT_BROWSER_SOURCE: ${{ github.workspace }}/output/browser-source
  SIGN_RELEASE: ${{ (inputs.sign_release || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-'))) && 'true' || 'false' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python3 scripts/check-assets.py
      - run: go test -race ./internal/transfer
      - name: Stable release validation gate
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        env:
          VALIDATED: ${{ vars.PHYSICAL_VALIDATION_APPROVED }}
        run: test "$VALIDATED" = "true" || { echo 'Complete physical-device validation and set PHYSICAL_VALIDATION_APPROVED before a stable release.'; exit 1; }
      - name: Read paired browser revision
        id: browser
        shell: bash
        run: python3 -c 'import json;print("revision="+json.load(open("frontend/standalone-manifest.json"))["revision"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: mguhlin/drawsplat
          ref: ${{ steps.browser.outputs.revision }}
          path: output/browser-source
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-details
          path: test-results/

  build:
    permissions:
      contents: read
      id-token: write
    env:
      WINDOWS_SIGNING_PROVIDER: ${{ vars.WINDOWS_SIGNING_PROVIDER || 'azure' }}
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
      WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_CERTIFICATE_THUMBPRINT }}
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            target: linux/amd64
          - os: windows-latest
            platform: windows
            target: windows/amd64
          - os: macos-latest
            platform: macos
            target: darwin/universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config xvfb dbus-x11
      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: Test native policy and file handling
        if: runner.os == 'Linux'
        run: go test -race -tags webkit2_41 ./...
      - name: Check reachable Go vulnerabilities
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -tags webkit2_41 ./...
      - name: Prepare Windows installer and verify Microsoft runtime publisher
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-windows.ps1
      - uses: azure/login@v2
        if: runner.os == 'Windows' && env.SIGN_RELEASE == 'true' && env.WINDOWS_SIGNING_PROVIDER == 'azure'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify bundled source
        run: python3 scripts/check-assets.py
        shell: bash
      - name: Build native application
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then version="1.0.0-rc.6"; fi
          args=()
          if [[ "$RUNNER_OS" == "Linux" ]]; then args+=(-tags webkit2_41); fi
          wails build -platform '${{ matrix.target }}' "${args[@]}" -ldflags "-X main.version=$version"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Sign Windows application
        if: runner.os == 'Windows' && env.SIGN_RELEASE == 'true'
        shell: pwsh
        run: ./scripts/sign-windows.ps1 -Path ./build/bin/SplatWorks-Desktop.exe
      - name: Enable Mac hardened runtime
        if: runner.os == 'macOS'
        shell: bash
        run: codesign --force --sign - --options runtime --entitlements build/darwin/entitlements.plist ./build/bin/*.app && codesign --verify --deep --strict ./build/bin/*.app
      - name: Sign and notarize Mac application
        if: runner.os == 'macOS' && env.SIGN_RELEASE == 'true'
        shell: bash
        run: python3 scripts/sign-macos.py ./build/bin/*.app
      - name: Linux native smoke test without networking
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          mkdir -p output/native
          sudo -E unshare --net -- bash -c 'ip link set lo up; xvfb-run -a dbus-run-session -- timeout 240 ./build/bin/SplatWorks-Desktop --smoke-test "$PWD/output/native"'
          sudo chown -R "$(id -u):$(id -g)" output
      - name: Windows native smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force output/native | Out-Null
          $app = Start-Process -FilePath './build/bin/SplatWorks-Desktop.exe' -ArgumentList '--smoke-test', "$pwd/output/native" -PassThru
          if (-not $app.WaitForExit(240000)) { $app.Kill(); throw 'Native smoke test timed out' }
          if ($app.ExitCode -ne 0) { throw "Native smoke test failed ($($app.ExitCode))" }
      - name: Mac native smoke test
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p output/native
          python3 - <<'PY'
          import pathlib,subprocess
          binary=next(pathlib.Path('build/bin').glob('*.app/Contents/MacOS/*'))
          subprocess.run([str(binary),'--smoke-test',str(pathlib.Path('output/native').resolve())],check=True,timeout=240)
          PY
      - name: Verify native report
        shell: bash
        run: python3 scripts/verify-native.py output/native
      - name: Package application and checksums
        shell: bash
        run: python3 scripts/package-release.py --platform '${{ matrix.platform }}' --version "$RELEASE_VERSION"
      - name: Verify Windows install, upgrade, installed app, and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-install.ps1
      - name: Verify Linux install, installed app, and removal
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: bash scripts/test-linux-install.sh
      - name: Verify Mac distribution archive and disk image
        if: runner.os == 'macOS'
        shell: bash
        run: python3 scripts/test-macos-package.py
      - name: Verify all package checksums
        shell: bash
        run: python3 scripts/verify-packages.py output/release
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: output/release/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-check-${{ matrix.platform }}
          path: output/native/*.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - name: Publish desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag "${args[@]}" --title "SplatWorks Desktop $GITHUB_REF_NAME" --notes-file docs/RELEASE.md
